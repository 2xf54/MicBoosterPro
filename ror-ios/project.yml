name: ror
options:
  bundleIdPrefix: com.ghazi
  deploymentTarget:
    iOS: "16.0"
targets:
  ror:
    type: application
    platform: iOS
    sources:
      - path: ror
      - path: Assets.xcassets
    info:
      path: ror/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghazi.ror
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
