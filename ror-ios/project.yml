name: ror
options:
  bundleIdPrefix: com.ghazi
  deploymentTarget:
    iOS: "16.0"
targets:
  ror:
    type: application
    platform: iOS
    sources:
      - path: ror
      - path: Assets.xcassets
    info:
      path: ror/Info.plist
      properties:
        CFBundleDisplayName: "ror"
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "ror connects to your Windows PC to send and receive files, photos, videos, and text."
        NSPhotoLibraryAddUsageDescription: "ror saves received photos and videos directly to your Photos library."
        NSPhotoLibraryUsageDescription: "ror lets you pick photos and videos to send to your PC."
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghazi.ror
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
