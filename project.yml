name: MicBoosterPro
options:
  bundleIdPrefix: com.ghazi
  deploymentTarget:
    iOS: "16.0"
targets:
  MicBoosterPro:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Extra Hearing"
        CFBundleShortVersionString: "4.3"
        CFBundleVersion: "43"
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "The app needs the microphone to amplify sound to your headphones in real time."
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghazi.micboosterpro
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
