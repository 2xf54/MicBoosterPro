name: Couple
options:
  bundleIdPrefix: com.ghazi
  deploymentTarget:
    iOS: "17.0"
targets:
  Couple:
    type: application
    platform: iOS
    sources:
      - path: Couple
      - path: Shared
      - path: Assets.xcassets
    entitlements:
      path: Couple/Couple.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ghazi.coupleapp
    dependencies:
      - target: CoupleWidget
    info:
      path: Couple/Info.plist
      properties:
        CFBundleDisplayName: "The Couple"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        NSLocationWhenInUseUsageDescription: "Used to calculate the distance between you and your partner."
        NSPhotoLibraryUsageDescription: "Used to choose avatars and custom backgrounds."
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghazi.coupleapp
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_IDENTITY: ""

  CoupleWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CoupleWidget
      - path: Shared
    entitlements:
      path: CoupleWidget/CoupleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ghazi.coupleapp
    info:
      path: CoupleWidget/Info.plist
      properties:
        CFBundleDisplayName: "Couple Widget"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghazi.coupleapp.widget
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_IDENTITY: ""
