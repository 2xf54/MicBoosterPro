name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive (No Code Sign)
        run: |
          xcodebuild archive \
            -project MicBoosterPro.xcodeproj \
            -scheme MicBoosterPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MicBoosterPro.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA with Assets
        run: |
          mkdir -p Payload
          cp -r build/MicBoosterPro.xcarchive/Products/Applications/MicBoosterPro.app Payload/
          if [ -d "launch.storyboardc" ]; then
            cp -r launch.storyboardc Payload/MicBoosterPro.app/
          fi
          if [ -f "Assets.car" ]; then
            cp Assets.car Payload/MicBoosterPro.app/
          fi
          zip -r MicBoosterPro.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicBoosterPro-IPA
          path: MicBoosterPro.ipa
          retention-days: 14

      - name: Publish or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Super Hearing Pro Latest"
          body: "النسخة المطابقة لـ Super Hearing بالكامل بحجم 35MB وبدون حواف سوداء وتضخيم 100%"
          files: MicBoosterPro.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
