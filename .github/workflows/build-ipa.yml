name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive (No Code Sign)
        run: |
          xcodebuild archive \
            -project MicBoosterPro.xcodeproj \
            -scheme MicBoosterPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MicBoosterPro.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify Info.plist (mic permission + launch screen)
        run: |
          PLIST=build/MicBoosterPro.xcarchive/Products/Applications/MicBoosterPro.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/MicBoosterPro.xcarchive/Products/Applications/MicBoosterPro.app Payload/
          zip -r MicBoosterPro.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicBoosterPro-IPA
          path: MicBoosterPro.ipa
          retention-days: 14

      - name: Publish or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Super Hearing Pro Latest"
          body: "Latest build"
          files: MicBoosterPro.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
